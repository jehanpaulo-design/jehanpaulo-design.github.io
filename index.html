<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRS Asset Intelligence · Release 3.1</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #142d36; background: #071d2b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 22px; background: linear-gradient(135deg, #071d2b, #0d6670); }
    main { width: min(100%, 520px); padding: 30px; background: #fffdf8; border: 1px solid #d8d2c4; box-shadow: 0 24px 70px rgba(0,0,0,.24); }
    .eyebrow { color: #0d6670; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 14px 0 8px; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(36px, 8vw, 58px); line-height: .96; font-weight: 500; }
    p { margin: 0 0 22px; color: #5d6a70; line-height: 1.5; }
    form, .links { display: grid; gap: 10px; }
    label { color: #30464f; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    input { min-height: 44px; padding: 9px 11px; border: 1px solid #c8c5bb; background: #fff; color: #172f38; font-size: 15px; }
    button, a.button { min-height: 45px; display: grid; place-items: center; padding: 12px 14px; border: 0; background: #0d6670; color: #fff; text-decoration: none; font-weight: 900; cursor: pointer; }
    a.secondary { background: #243b45; }
    output { color: #a93338; font-size: 12px; }
    small { display: block; margin-top: 18px; color: #6f7b80; font-size: 11px; line-height: 1.45; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">MRS Asset Intelligence</span>
    <h1>Release 3.1</h1>
    <p>Portal GitHub para acesso controlado à versão de revisão do Asset Intelligence ferroviário.</p>

    <form id="login-form">
      <label for="login">Login</label>
      <input id="login" autocomplete="username" />
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" />
      <output id="message"></output>
      <button type="submit">Entrar</button>
    </form>

    <section id="release-links" class="links hidden" aria-label="Links da Release 3.1">
      <a class="button" href="https://github.com/atlas-vp/mrs-asset-intelligence/pull/12">Abrir Release 3.1 no GitHub</a>
      <a class="button secondary" href="https://github.com/atlas-vp/mrs-asset-intelligence/tree/codex/phase-2b-risk-readiness">Abrir branch técnica</a>
      <small>O repositório do Asset é privado. Usuários do time precisam estar liberados em atlas-vp/mrs-asset-intelligence.</small>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const links = document.getElementById('release-links');
    const message = document.getElementById('message');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value;
      if (login === 'Atlasvp' && password === '2026') {
        form.classList.add('hidden');
        links.classList.remove('hidden');
        return;
      }
      message.textContent = 'Login ou senha inválidos.';
    });
  </script>
</body>
</html>
